services:
  - type: web
    name: selfie-attendance-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: selfie-attendance-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
        value: "selfie-attendance-prod-jwt-secret-2024"
      - key: DB_SSL
        value: true
      - key: MAX_FILE_SIZE
        value: "62914560"
      # Globe FSM sync (fsmSync.js). Leave disabled until Globe provides an
      # authorized delivery path (SFTP drop / static export URL / API creds).
      - key: FSM_SYNC_ENABLED
        value: "false"
      - key: FSM_SYNC_MODE
        value: "folder"
      - key: FSM_SYNC_FOLDER
        value: ""
      - key: FSM_SYNC_INTERVAL_MIN
        value: "30"
      - key: FSM_SFTP_HOST
        value: ""
      - key: FSM_SFTP_USERNAME
        value: ""
      - key: FSM_SFTP_PASSWORD
        sync: false
        value: ""

databases:
  - name: selfie-attendance-db
    plan: free
    databaseName: selfie_attendance
    ipAllowList: []
