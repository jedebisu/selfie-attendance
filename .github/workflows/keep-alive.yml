name: Keep API warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://selfie-api-sqgh.onrender.com/api/health || true)
          echo "Health check responded with: $code"
